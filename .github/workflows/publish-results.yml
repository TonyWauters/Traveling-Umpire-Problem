name: Publish accepted results

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "submissions/**"
      - "solutions/legacy/**"
      - "results/legacy-*.csv"
      - "scripts/*.py"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: publish-tup-results
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and rebuild result files
        run: python3 scripts/update_results.py
      - name: Open or update generated results pull request
        id: results-pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-results
          base: main
          add-paths: |
            results/best-known.csv
            results/submissions.csv
            results/README.md
          commit-message: Update validated TUP results
          title: Update validated TUP results
          body: |
            Rebuild the results tables from restored legacy solutions and validated submissions accepted on `main`.

            Merge after the required `validate` check passes and review is complete.
      # Explicit dispatch ensures validation runs for a PR made with GITHUB_TOKEN.
      # Dispatch on the PR branch so the check is attached to its head commit.
      - name: Validate generated results pull request
        if: steps.results-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run benchmark.yml --ref automation/update-results
