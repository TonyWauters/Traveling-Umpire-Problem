name: Publish accepted results

on:
  push:
    branches: [main]
    paths:
      - "submissions/**"

permissions:
  contents: write

concurrency:
  group: publish-tup-results
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and rebuild result files
        run: python3 scripts/update_results.py
      - name: Commit generated result files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/best-known.csv results/submissions.csv results/README.md
          if git diff --cached --quiet; then
            echo "Results are already current."
          else
            git commit -m "Update validated TUP results"
            git push
          fi
